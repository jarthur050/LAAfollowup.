    justify-content: center;

  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 20px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin: 16px 0 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 1rem;
  }
  .qr-wrap {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    background: #ffffff;
    border-radius: 12px;
    padding: 16px;
    min-height: 232px;
    align-items: center;
  }
  #qrcode img, #qrcode canvas { display: block; }
  .hint {
    margin-top: 14px;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }
  .warn {
    margin-top: 10px;
    font-size: 0.8rem;
    color: #e0824a;
    text-align: center;
    min-height: 1em;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>London's Air Ambulance Follow up Request</h1>
    <p class="sub">Scan the code with a phone camera to open a pre-addressed email.</p>

    <label for="email">Send to</label>
    <input id="email" type="email" placeholder="e.g. name@nhs.net" autocomplete="email">

    <label for="subject">CAD</label>
    <input id="subject" type="text" placeholder="e.g. 12345">

    <div class="qr-wrap"><div id="qrcode"></div></div>
    <div class="warn" id="warn"></div>
  </div>

<script>
  const emailInput = document.getElementById('email');
  const subjectInput = document.getElementById('subject');
  const qrDiv = document.getElementById('qrcode');
  const warn = document.getElementById('warn');

  try {
    const savedEmail = localStorage.getItem('mailqr_email');
    const savedSubject = localStorage.getItem('mailqr_subject');
    if (savedEmail) emailInput.value = savedEmail;
    if (savedSubject) subjectInput.value = savedSubject;
  } catch (e) {}

  function todayDDMMYY() {
    const d = new Date();
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yy = String(d.getFullYear()).slice(-2);
    return dd + '/' + mm + '/' + yy;
  }

  function isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  function render() {
    const email = emailInput.value.trim();
    const cad = subjectInput.value;

    try {
      localStorage.setItem('mailqr_email', email);
      localStorage.setItem('mailqr_subject', cad);
    } catch (e) {}

    qrDiv.innerHTML = '';
    warn.textContent = '';

    if (!email) {
      warn.textContent = 'Enter an email address to generate a code.';
      return;
    }
    if (!isValidEmail(email)) {
      warn.textContent = 'That doesn\u2019t look like a valid email address.';
      return;
    }

    const subject = cad + ' ' + todayDDMMYY();
    const mailto = 'mailto:' + encodeURIComponent(email) + '?subject=' + encodeURIComponent(subject);

    new QRCode(qrDiv, {
      text: mailto,
      width: 200,
      height: 200,
      colorDark: '#000000',
      colorLight: '#ffffff'
    });
  }

  emailInput.addEventListener('input', render);
  subjectInput.addEventListener('input', render);
  render();
</script>
</body>
</html>
